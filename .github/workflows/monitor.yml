name: Check for new mentions

on:
  schedule:
    # Every second day at 06:17 UK winter time (UTC).
    - cron: "17 6 */2 * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      # Always start from the latest version of the project (re-runs otherwise use an old copy).
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect mentions
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python -m monitor.run

      - name: Save results
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "mention-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RESULTS="README.md docs/data docs/feed.xml docs/mentions.csv state/state.json"
          mkdir -p /tmp/results && cp -r --parents $RESULTS /tmp/results/
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            # Start from whatever is on GitHub now (keeps any edits made during the run),
            # then put this run's results on top.
            git reset --hard "origin/$BRANCH"
            cp -r /tmp/results/. .
            git add $RESULTS
            if git diff --cached --quiet; then
              echo "Nothing new to save"
              exit 0
            fi
            git commit -m "Update mentions $(date -u +'%Y-%m-%d %H:%M UTC')"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Something else saved at the same moment; trying again ($attempt)"
            sleep $((attempt * 5))
          done
          echo "Could not save results after 5 attempts"
          exit 1

  # Publishes the dashboard page (needs Settings > Pages > Source: GitHub Actions).
  dashboard:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v5
