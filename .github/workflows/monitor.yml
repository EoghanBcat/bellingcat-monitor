name: Check for new mentions

on:
  schedule:
    # Every second day at 06:17 UK winter time (UTC).
    - cron: "17 6 */2 * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Collect mentions
        env:
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python -m monitor.run

      - name: Save results
        run: |
          git config user.name "mention-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs state
          if git diff --cached --quiet; then
            echo "Nothing new to save"
          else
            git commit -m "Update mentions $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

  # Publishes the dashboard page (needs Settings > Pages > Source: GitHub Actions).
  dashboard:
    needs: monitor
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
